<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiSwitch NG migration</title>
<style>
:root { color-scheme: light dark; --bg:#f6f7f9; --fg:#1d2330; --card:#fff; --line:#d7dce4; --muted:#667085; --acc:#1f6feb; --warn:#b54708; --ok:#067647; --info:#475467; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171d; --fg:#e6e9ef; --card:#1c2029; --line:#2f3542; --muted:#98a2b3; --acc:#5b9dff; --warn:#f79009; --ok:#47cd89; --info:#98a2b3; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
h1 { font-size: 22px; margin: 0 0 8px; }
h2 { font-size: 17px; margin: 24px 0 8px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
.muted { color: var(--muted); font-size: 13px; }
.warn { color: var(--warn); }
.ok { color: var(--ok); }
li.info { color: var(--info); }
li.warn { color: var(--warn); }
button { font: inherit; padding: 7px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
button:disabled { opacity:.45; cursor:not-allowed; }
input[type=text], select { font: inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); max-width:100%; }
.model > header { margin-bottom: 8px; }
.inst { display:grid; grid-template-columns: auto 1fr; gap:6px 14px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.inst > label, .inst > span { grid-column: 2; }
.inst .inc { grid-column: 1; grid-row: 1 / span 4; align-self:start; }
.inst .mv { display:flex; gap:6px; }
.res { border-top:1px solid var(--line); padding-top:10px; }
ul { margin: 6px 0; padding-left: 20px; }
.actions button { margin: 0 6px 6px 0; }
#status { margin: 8px 0; min-height: 1.4em; }
code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
summary { cursor: pointer; }
.row { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><h1 id="title"></h1><p id="intro"></p></div><button id="langBtn"></button></header>
  <section class="card">
    <button id="btnRw" class="primary"></button>
    <button id="btnRo"></button>
    <input type="file" id="dirInput" webkitdirectory multiple hidden>
    <p class="muted" id="pickHint"></p>
    <p class="muted" id="browserNote"></p>
    <div id="status" class="warn"></div>
  </section>
  <div id="main"></div>
</div>
<script>/*__CORE__*/</script>
<script>/*__SCAN__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
